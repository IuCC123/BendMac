name: BendMac
options:
  bundleIdPrefix: local.jamie
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: '14.0'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  BendMac:
    type: application
    platform: macOS
    sources: [BendMac]
    info:
      path: BendMac/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleIconFile: AppIcon
        SUFeedURL: https://raw.githubusercontent.com/IuCC123/BendMac/main/docs/appcast.xml
        SUPublicEDKey: 'iUPmfmMW4EovxYx3kXOHVfcOT9oeGCc3EMIx5p4wJ44='
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 21600
        SUAutomaticallyUpdate: false
        SUSendProfileInfo: false
    entitlements:
      path: BendMac/BendMac.entitlements
      properties:
        # Ad-hoc signatures have no Team ID for matching the embedded framework.
        # Remove this exception when migrating to Developer ID distribution.
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.jamie.BendMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: 'Copyright 2026 BendMac contributors. MIT License.'
        INFOPLIST_KEY_CFBundleDisplayName: BendMac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MARKETING_VERSION: '0.4.8'
        CURRENT_PROJECT_VERSION: '12'
    dependencies:
      - package: Sparkle
      - sdk: AppKit.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: MetalKit.framework
      - sdk: IOKit.framework
      - sdk: Carbon.framework
