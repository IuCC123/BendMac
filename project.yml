name: BendMac
options:
  bundleIdPrefix: local.jamie
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: '14.0'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  BendMac:
    type: application
    platform: macOS
    sources: [BendMac]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.jamie.BendMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: 'Copyright 2026 BendMac contributors. MIT License.'
        INFOPLIST_KEY_CFBundleDisplayName: BendMac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MARKETING_VERSION: '0.4.0'
        CURRENT_PROJECT_VERSION: '4'
        INFOPLIST_KEY_SUFeedURL: https://raw.githubusercontent.com/IuCC123/BendMac/main/docs/appcast.xml
        INFOPLIST_KEY_SUPublicEDKey: 'iUPmfmMW4EovxYx3kXOHVfcOT9oeGCc3EMIx5p4wJ44='
        INFOPLIST_KEY_SUVerifyUpdateBeforeExtraction: YES
        INFOPLIST_KEY_SUEnableAutomaticChecks: YES
        INFOPLIST_KEY_SUAutomaticallyUpdate: NO
        INFOPLIST_KEY_SUSendProfileInfo: NO
    dependencies:
      - package: Sparkle
      - sdk: AppKit.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: MetalKit.framework
      - sdk: IOKit.framework
      - sdk: Carbon.framework
